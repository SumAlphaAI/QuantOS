[project]
name = "quantos-trading-agents"
version = "0.1.0"
description = "Controlled TradingAgents decision engine for QuantOS"
requires-python = ">=3.12,<3.13"
dependencies = [
  "quantos-engine-sdk",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
quantos-engine-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agents"]

[tool.hatch.build]
include = [
  "src/trading_agents/fixtures/*.json",
]
