[project]
name = "quantos-engine-sdk"
version = "0.1.0"
description = "Shared QuantOS engine SDK"
requires-python = ">=3.9,<3.10"
dependencies = [
  "protobuf==5.29.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google", "src/quantos", "sdk_src/quantos_engine_sdk"]
