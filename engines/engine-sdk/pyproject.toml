[project]
name = "quantos-engine-sdk"
version = "0.1.0"
description = "Shared QuantOS engine SDK"
requires-python = ">=3.12,<3.13"
dependencies = [
  "grpcio==1.74.0",
  "protobuf==5.29.6",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google", "src/quantos", "sdk_src/quantos_engine_sdk"]
