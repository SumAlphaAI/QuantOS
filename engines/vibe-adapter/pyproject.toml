[project]
name = "quantos-vibe-adapter"
version = "0.1.0"
description = "Controlled Vibe-Trading adapter skeleton for QuantOS"
requires-python = ">=3.9,<3.10"
dependencies = [
  "quantos-engine-sdk",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
quantos-engine-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/vibe_adapter"]

[tool.hatch.build]
include = [
  "src/vibe_adapter/fixtures/*.json",
]
