[project]
name = "quantos-mock-engine"
version = "0.1.0"
description = "Deterministic mock engine for QuantOS"
requires-python = ">=3.9,<3.10"
dependencies = [
  "quantos-engine-sdk",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.uv.sources]
quantos-engine-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mock_engine"]
