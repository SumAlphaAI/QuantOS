[project]
name = "quantos-engines-workspace"
version = "0.1.0"
description = "QuantOS Python engine workspace"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
security = ["pip-audit==2.9.0"]
build = ["hatchling==1.27.0", "tomli==2.2.1"]
dev = [
  "pyright==1.1.403",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
  "ruff==0.12.7",
]

[tool.uv.workspace]
members = [
  "engine-sdk",
  "llmquant",
  "mock-engine",
  "openbb-adapter",
  "rd-agent",
  "strategy-lab",
  "trading-agents",
  "vibe-adapter",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "engine-sdk/src/google",
  "engine-sdk/src/quantos",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["*/src", "tests"]
exclude = ["**/engine-sdk/src/google", "**/engine-sdk/src/quantos"]
ignore = ["engine-sdk/src/google", "engine-sdk/src/quantos"]

[tool.coverage.run]
branch = true
omit = [
  "*/tests/*",
  "*/engine-sdk/src/google/*",
  "*/engine-sdk/src/quantos/*",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
