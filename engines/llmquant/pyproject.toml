[project]
name = "quantos-llmquant"
version = "0.1.0"
description = "Controlled LLMQuant signal engine for QuantOS"
requires-python = ">=3.9,<3.10"
dependencies = [
  "quantos-engine-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
quantos-engine-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/llmquant"]

[tool.hatch.build]
include = [
  "src/llmquant/fixtures/*.json",
]
