[package]
name = "quantos-terminal"
version = "0.1.0"
edition = "2021"
description = "QuantOS Terminal desktop shell (Tauri 2, loads the shared Terminal app)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1

# GTK 3 requires glib 0.18; this copy backports RUSTSEC-2024-0429.
[patch.crates-io]
glib = { path = "../../../third_party/rust/glib" }
