<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1600"
     height="900"
     viewBox="0 0 1600 900"
     role="img"
     aria-labelledby="title description">
  <title id="title">SumAlpha logo</title>
  <desc id="description">A graphite Sigma containing a warm-gold lowercase Greek alpha, with an open separation on the right.</desc>

  <defs>
    <style>
      .graphite { fill: #202020; }
      .gold-stroke {
        fill: none;
        stroke: #c8a34a;
        stroke-width: 34;
        stroke-linecap: butt;
        stroke-linejoin: round;
      }
      .wordmark {
        fill: #202020;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 150px;
        font-weight: 700;
        letter-spacing: -5px;
      }
    </style>
  </defs>

  <!-- Geometric Sigma: the right side is intentionally open. -->
  <path class="graphite"
        d="M215 275 H610 L552 355 H506 L539 310 H287 L333 371 L307 397 Z"/>
  <path class="graphite"
        d="M307 512 L333 538 L289 597 H539 L507 552 H553 L612 632 H215 Z"/>

  <!-- Lowercase Greek alpha embedded horizontally through the Sigma. -->
  <path class="gold-stroke"
        d="M459 494
           C441 524 414 540 383 540
           C338 540 306 506 306 459
           C306 412 338 377 384 377
           C421 377 447 398 470 435
           L532 531"/>

  <!-- Alpha's upper terminal; separated from the Sigma by negative space. -->
  <path fill="#c8a34a"
        d="M478 437 L512 377 H542 L495 448 Z"/>

  <!-- Wordmark remains editable text for easy brand-system adjustments. -->
  <text class="wordmark" x="655" y="526">SumAlpha</text>
</svg>
