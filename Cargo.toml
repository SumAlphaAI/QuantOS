[workspace]
members = [
  "crates/quantos-core",
  "crates/quantos-auth",
  "crates/quantos-engine-manager",
  "crates/quantos-event",
  "crates/quantos-evidence",
  "crates/quantos-execution",
  "crates/quantos-market",
  "crates/quantos-observability",
  "crates/quantos-policy",
  "crates/quantos-portfolio",
  "crates/quantos-proto",
  "crates/quantos-reconcile",
  "crates/quantos-risk",
  "crates/quantos-runtime",
  "crates/quantos-storage",
  "crates/quantos-strategy",
  "services/execution-gateway",
  "services/capacity-monitor",
  "services/market-ingestor",
  "services/portfolio-rebuild",
  "services/replay-cli",
  "services/runtime-gateway",
  "services/bff-gateway",
]
# Tauri 桌面壳独立于领域 workspace：GUI/平台依赖不进入 cargo check/clippy --workspace
exclude = ["apps/terminal-desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
authors = ["SumAlpha"]
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.7.9"
bytes = "1.11.0"
clap = { version = "4.5.53", features = ["derive"] }
chrono = { version = "0.4.42", features = ["clock", "serde"] }
futures-util = "0.3.31"
hex = "0.4.3"
http = "1.3.1"
hyper-util = { version = "0.1.20", features = ["tokio"] }
native-tls = "0.2.14"
pbjson-types = "0.7.0"
postgres = { version = "0.19.12", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
postgres-native-tls = "0.5.2"
prost = "0.13.5"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rust_decimal = { version = "1.39.0", features = ["serde-with-str"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
tonic = { version = "0.12.3", default-features = false, features = ["codegen", "transport", "prost"] }
tower = "0.5.2"
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
