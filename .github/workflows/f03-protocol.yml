name: F03 Protocol Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proto-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QUANTOS_PROTO_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.0"
      - name: Install locked dependencies
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
          uv sync --locked --project engines --all-packages
      - name: Test receipt rejection rules
        run: node --test scripts/tests/record-f03-receipt.test.mjs
      - name: Validate proto workspace and cross-language compatibility
        id: protocol
        shell: bash
        run: |
          mkdir -p artifacts/f03
          make proto-check 2>&1 | tee artifacts/f03/proto-check.log
      - name: Record exact-SHA protocol and generated-artifact receipt
        if: always()
        env:
          PROTO_OUTCOME: ${{ steps.protocol.outcome }}
        run: node scripts/record-f03-receipt.mjs
      - name: Archive F03 protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f03-protocol-${{ github.sha }}
          path: artifacts/f03/
          if-no-files-found: error
