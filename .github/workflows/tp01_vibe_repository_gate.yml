name: TP01 Vibe Repository Gate

on:
  pull_request:
    paths:
      - ".gitmodules"
      - "third_party/vibe-trading/**"
      - "forks/vibe-trading/**"
      - "scripts/*vibe-repositor*"
      - ".github/workflows/tp01_vibe_repository_gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-and-remote-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout QuantOS and pinned upstream submodule
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Normalize and verify read-only upstream
        run: node ./scripts/bootstrap-vibe-repositories.mjs --readonly-only

      - name: Prove controlled fork remote gate
        run: node ./scripts/test-vibe-repository-gate.mjs

      - name: Verify real fork branches and protection
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.TP01_FORK_ADMIN_TOKEN }}
        run: node ./scripts/provision-vibe-github-governance.mjs
