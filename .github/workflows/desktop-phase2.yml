name: QuantOS Desktop Phase 2 (Deferred)

# 第二期 Desktop 专用手动工作流；不属于第一期 Web PRE-06 或发布 Gate。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-contract:
    name: Desktop contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - run: corepack enable pnpm
      # Dedicated second-phase workspace and lock, never used by F01.
      - run: |
          cp pnpm-workspace.desktop.yaml pnpm-workspace.yaml
          cp pnpm-lock.desktop.yaml pnpm-lock.yaml
          pnpm install --frozen-lockfile
      - run: pnpm --filter @sumalpha/terminal-desktop typecheck
      - run: pnpm --filter @sumalpha/terminal-desktop test
      - name: Tauri deep-link sanitizer and routing gate
        if: runner.os == 'macOS'
        run: pnpm test:tauri-deep-link
