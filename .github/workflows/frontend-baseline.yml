name: Frontend Baseline (FEP-0)

# PRE-06 Web-only 测试基线 CI：设计 token / 环境配置 / contract fixtures / Web 构建 smoke /
# 性能预算 / 官网与 Terminal Playwright+axe / 视觉基线完整性 / 破坏自检。

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-baseline:
    runs-on: ubuntu-24.04
    env:
      QUANTOS_BFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      NEXT_PUBLIC_QUANTOS_ENV: local-mock
      NEXT_PUBLIC_SITE_ORIGIN: https://sumalpha.ai
      NEXT_PUBLIC_QUANTOS_TERMINAL_ORIGIN: http://localhost:3190
      NEXT_PUBLIC_QUANTOS_BFF_ORIGIN: http://localhost:4010
      NEXT_PUBLIC_QUANTOS_OIDC_ISSUER: https://mock.idp.local
      NEXT_PUBLIC_QUANTOS_OIDC_CLIENT_ID: quantos-terminal-ci
      NEXT_PUBLIC_QUANTOS_OIDC_REDIRECT_URI: http://localhost:3190/auth/callback
      NEXT_PUBLIC_QUANTOS_DEFAULT_MODE: paper
      NEXT_PUBLIC_QUANTOS_MOCK_ENABLED: "true"
      NEXT_PUBLIC_QUANTOS_OBS_ENABLED: "false"
      NEXT_PUBLIC_QUANTOS_FEATURE_ASSISTED_LIVE_TESTNET: "off"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Setup Rust for A2 semantic regressions
        uses: dtolnay/rust-toolchain@1.91.0

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Bootstrap workspace
        run: pnpm install --frozen-lockfile

      - name: Development plan cross-document order and negative probes
        run: pnpm check:development-plans && pnpm test:development-plans

      - name: Design token & i18n checks (PRE-02)
        run: pnpm check:pre02 && pnpm test:pre02

      - name: Environment config checks (PRE-05)
        run: pnpm check:pre05 && pnpm test:pre05

      - name: PRE-01 page, permission, state and traceability contract
        run: pnpm check:pre01 && pnpm test:pre01

      - name: Frozen BFF OpenAPI structure
        run: pnpm check:bff-openapi

      - name: Generated BFF client, schema and MSW drift
        run: pnpm check:bff-generated

      - name: BFF page contract coverage
        run: pnpm check:bff-contract-coverage

      - name: A1 BFF-FE-000 operation baseline and negative probes
        run: pnpm check:bff-fe-000 && pnpm test:bff-fe-000

      - name: A1 development baseline (staging runs at final review)
        run: pnpm check:bff-a1-development

      - name: BFF compatibility and semantic remediation regressions
        run: pnpm check:bff-compatibility && pnpm test:bff-remediation

      - name: A2 BFF-FE-001 auth and settings contract Gate
        run: pnpm check:bff-fe-001 && pnpm test:bff-fe-001

      - name: A2 BFF-FE-007 audit and controlled export contract Gate
        run: pnpm check:bff-fe-007 && pnpm test:bff-fe-007

      - name: Interface inventory (PRE-04)
        run: pnpm check:pre04 && pnpm test:pre04

      - name: PRE-06 structure and negative gates
        run: pnpm check:pre06 && pnpm test:pre06

      - name: P0 acceptance receipt policy regressions
        run: pnpm test:p0

      - name: G0 signed record and compatibility ledger
        run: pnpm check:g0-records

      - name: Contract fixture tests (PRE-06)
        run: pnpm exec vitest run tests/contract

      - name: Lint & typecheck frontend packages
        run: pnpm --filter @sumalpha/ui --filter @sumalpha/config --filter @sumalpha/terminal --filter @sumalpha/website lint && pnpm --filter @sumalpha/ui --filter @sumalpha/config --filter @sumalpha/terminal --filter @sumalpha/website typecheck

      - name: Critical risk branch coverage
        run: pnpm coverage:critical

      - name: Unit tests
        run: pnpm --filter @sumalpha/terminal --filter @sumalpha/website --filter @sumalpha/ui --filter @sumalpha/config test

      - name: Build website & terminal
        run: pnpm --filter @sumalpha/website build && pnpm --filter @sumalpha/terminal build

      - name: Client artifact secret check (PRE-05)
        run: pnpm check:client-secrets

      - name: Install Playwright Chromium for PRE-03 browser smoke
        run: pnpm exec playwright install chromium --with-deps

      - name: Web build smoke and negative probes (PRE-03 Web-only)
        run: pnpm check:pre03:web && pnpm test:pre03

      - name: Performance budget
        run: node scripts/check-perf-budget.mjs apps/terminal/out && node scripts/check-perf-budget.mjs apps/website/out

      - name: Visual baseline integrity
        run: pnpm check:visual-baselines --platform linux

      # 本 job 仅安装 Chromium，必须限定 --project=chromium；
      # playwright test 不带 --project 会运行全部浏览器项目（firefox/webkit 全矩阵由 compatibility.yml 负责）
      - name: Terminal Playwright E2E + axe + available platform visuals
        run: pnpm exec playwright test --project=chromium

      - name: Website Playwright E2E + axe
        run: pnpm test:browser:website --project=chromium

      - name: Sabotage self-test (schema/permission/sensitive-field/visual must fail the gates)
        run: node scripts/pre06-sabotage-check.mjs

      - name: Archive browser reports and failure attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-evidence
          path: artifacts/browser/
          retention-days: 14
          if-no-files-found: warn
