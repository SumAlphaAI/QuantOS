name: F08 Engine CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f08-stable-gate:
    runs-on: ubuntu-24.04
    env:
      QUANTOS_SKIP_ENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy, llvm-tools-preview
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.0"
      - run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - run: uv sync --locked --project engines --all-packages
      - name: Run F08 stable Gate
        run: |
          mkdir -p artifacts/f08
          printf '%s\n' '${{ github.sha }}' > artifacts/f08/source-sha.txt
          make f08-check 2>&1 | tee artifacts/f08/stable-gate.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f08-ci-${{ github.sha }}
          path: |
            artifacts/f08/
            target/f08-python-coverage.json
            target/f08-rust-coverage.json
          if-no-files-found: warn
