name: F05 Event Manual Maintenance

on:
  workflow_dispatch:
    inputs:
      confirm_full_database_run:
        description: "Manually run retained database fixtures, recovery and full coverage"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  branch-and-database:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_full_database_run
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUANTOS_SKIP_ENV: "1"
      QUANTOS_MANUAL_F05_F07: "1"
      F02_PG_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres?sslmode=disable
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Measure complete F05 coverage with PostgreSQL and HTTP fault tests
        run: make f05-db-coverage
        env:
          QUANTOS_F05_BRANCH: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f05-manual-${{ github.sha }}
          path: |
            artifacts/f05/
          if-no-files-found: error
