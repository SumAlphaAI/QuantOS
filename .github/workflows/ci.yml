name: QuantOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_QUANTOS_ENV: local-mock
      NEXT_PUBLIC_SITE_ORIGIN: https://sumalpha.ai
      NEXT_PUBLIC_QUANTOS_TERMINAL_ORIGIN: http://localhost:3190
      NEXT_PUBLIC_QUANTOS_BFF_ORIGIN: http://localhost:4010
      NEXT_PUBLIC_QUANTOS_OIDC_ISSUER: https://mock.idp.local
      NEXT_PUBLIC_QUANTOS_OIDC_CLIENT_ID: quantos-terminal-ci
      NEXT_PUBLIC_QUANTOS_OIDC_REDIRECT_URI: http://localhost:3190/auth/callback
      NEXT_PUBLIC_QUANTOS_DEFAULT_MODE: paper
      NEXT_PUBLIC_QUANTOS_MOCK_ENABLED: "true"
      NEXT_PUBLIC_QUANTOS_OBS_ENABLED: "false"
      NEXT_PUBLIC_QUANTOS_FEATURE_ASSISTED_LIVE_TESTNET: "off"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.0"

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Install Rust coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Bootstrap workspace
        run: make bootstrap

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Build Terminal app (Playwright webServer serves apps/terminal/out)
        run: pnpm --filter @sumalpha/terminal build

      - name: Run browser automation suite
        run: pnpm test:browser --project=chromium

      - name: Secret scan
        env:
          GITLEAKS_VERSION: "8.28.0"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --config .gitleaks.toml --redact --verbose .

      - name: Validate lockfiles
        run: make lockfile-check

      - name: Validate proto workspace
        run: make proto-check

      - name: Validate BFF OpenAPI and generated contracts
        run: make bff-contract-check

      - name: Test BFF auth and settings reference provider
        run: make bff-provider-test

      - name: Validate R01 market ingestion contract and replay
        run: make r01-check

      - name: Validate R02 snapshot and quality Gate source contract
        run: make r02-check

      - name: Validate migration baseline
        run: make db-migration-check

      - name: Deliberately break quality gates
        run: make quality-gate-self-test

      - name: Lint workspace
        run: make lint

      - name: Test workspace
        run: make test

      - name: Check Python coverage
        run: make coverage-python

      - name: Check TypeScript coverage
        run: make coverage-web

      - name: Check Rust coverage
        run: make coverage-rust

      - name: Check licenses
        run: make license-check

      - name: Check SCA waivers
        run: make waiver-check

      - name: Check TP02-TP05 intake and production topology
        run: make tp-intake-check

      - name: Run SCA checks
        run: make sca-check

      - name: Check remote schema drift
        if: ${{ env.DATABASE_URL != '' }}
        run: make db-schema-diff

      - name: Replay migrations in isolated schema
        if: ${{ env.DATABASE_URL != '' }}
        run: make db-replay-check

      - name: Check remote RLS policies
        if: ${{ env.DATABASE_URL != '' }}
        run: make rls-policy-test

      - name: Generate SBOM
        run: make sbom

      - name: Generate build manifest
        run: make build-manifest

      - name: Generate pull-request integrity signatures
        if: ${{ github.event_name == 'pull_request' }}
        run: make sign-artifacts

      - name: Sign main build artifacts
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          QUANTOS_SIGNING_KEY: ${{ secrets.QUANTOS_SIGNING_KEY }}
          QUANTOS_REQUIRE_FORMAL_SIGNATURE: "1"
        run: make sign-artifacts

      - name: Verify formal artifact signatures
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          QUANTOS_SIGNING_KEY: ${{ secrets.QUANTOS_SIGNING_KEY }}
        run: make verify-artifact-signatures

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantos-build-artifacts
          path: artifacts/
          if-no-files-found: error
