name: QuantOS CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write
  security-events: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.10
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUANTOS_SKIP_ENV: "1"
      F02_PG_ADMIN_URL: postgresql://postgres@127.0.0.1:5432/postgres
      GITLEAKS_BIN: ${{ github.workspace }}/artifacts/tools/gitleaks
      QUANTOS_PROTO_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      CARGO_TERM_COLOR: always
      NEXT_PUBLIC_QUANTOS_ENV: local-mock
      NEXT_PUBLIC_SITE_ORIGIN: https://sumalpha.ai
      NEXT_PUBLIC_QUANTOS_TERMINAL_ORIGIN: http://localhost:3190
      NEXT_PUBLIC_QUANTOS_BFF_ORIGIN: http://localhost:4010
      NEXT_PUBLIC_QUANTOS_OIDC_ISSUER: https://mock.idp.local
      NEXT_PUBLIC_QUANTOS_OIDC_CLIENT_ID: quantos-terminal-ci
      NEXT_PUBLIC_QUANTOS_OIDC_REDIRECT_URI: http://localhost:3190/auth/callback
      NEXT_PUBLIC_QUANTOS_DEFAULT_MODE: paper
      NEXT_PUBLIC_QUANTOS_MOCK_ENABLED: "true"
      NEXT_PUBLIC_QUANTOS_OBS_ENABLED: "false"
      NEXT_PUBLIC_QUANTOS_FEATURE_ASSISTED_LIVE_TESTNET: "off"

    steps:
      - name: F02-A11 isolated required-check rejection probe
        run: exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.0"

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Install Rust coverage tooling
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Bootstrap workspace
        run: make bootstrap

      - name: Install Playwright Chromium
        # Match baseline capture and compatibility: system dependencies include fonts.
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Terminal app (Playwright webServer serves apps/terminal/out)
        run: pnpm --filter @sumalpha/terminal build

      - name: Require complete Linux visual baselines
        run: node scripts/check-visual-baselines.mjs --platform linux

      - name: Record browser rendering environment
        run: |
          mkdir -p artifacts/browser
          pnpm exec playwright --version > artifacts/browser/playwright-version.txt
          pnpm exec playwright install --dry-run chromium > artifacts/browser/browser-install.txt
          fc-list | sort > artifacts/browser/fonts.txt

      - name: Run browser automation suite
        run: pnpm test:browser --project=chromium --reporter=github,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: artifacts/browser/terminal.json

      - name: Archive browser comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-browser-comparison-${{ github.sha }}
          path: |
            artifacts/browser/
            test-results/
          if-no-files-found: warn

      - name: Install checksum-verified secret scanner
        run: bash scripts/install-gitleaks.sh

      - name: Secret scan
        run: bash scripts/check-secrets.sh

      - name: Validate lockfiles
        run: make lockfile-check

      - name: Validate proto workspace
        run: make proto-check

      - name: Validate BFF OpenAPI and generated contracts
        run: make bff-contract-check

      - name: Test BFF auth and settings reference provider
        run: make bff-provider-test

      - name: Validate R01 market ingestion contract and replay
        run: make r01-check

      - name: Validate R02 snapshot and quality Gate source contract
        run: make r02-check

      - name: Validate F04 core primitives and deterministic fixtures
        run: make f04-check

      - name: Validate F05 event, storage and audit source Gate
        run: make f05-check

      - name: Validate migration baseline
        run: make db-migration-check

      - name: Deliberately break quality gates
        run: make quality-gate-self-test

      - name: Lint workspace
        run: make lint

      - name: Test workspace
        run: make test

      - name: Check Python coverage
        run: make coverage-python

      - name: Check TypeScript coverage
        run: make coverage-web

      - name: Check Rust coverage
        run: make coverage-rust

      - name: Check licenses
        run: make license-check

      - name: Check SCA waivers
        run: make waiver-check

      - name: Check TP02-TP05 intake and production topology
        run: make tp-intake-check

      - name: Run SCA checks
        run: make sca-check

      - name: Rebuild isolated databases and test drift and RLS
        run: make f02-db-check

      - name: Run F05 disposable PostgreSQL acceptance Gate
        run: make f05-db-check

      - name: Check F02 rejection and recovery paths
        run: make f02-check

      - name: Build and package all runtime artifacts
        run: make f02-package

      - name: Generate unsigned build integrity digest
        run: make sign-artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantos-build-inputs
          path: |
            artifacts/release/
            artifacts/signatures/
          if-no-files-found: error

      - name: Archive F02 validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f02-validation-evidence
          path: artifacts/f02/
          if-no-files-found: error

  signing-policy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      # Read-only preflight prevents implicit creation of an unprotected Environment.
      - run: node scripts/check-f02-signing-policy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  sign-main:
    needs: [verify, signing-policy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: f02-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: quantos-build-inputs
          path: artifacts
      - name: Sign main build artifacts
        env:
          QUANTOS_SIGNING_KEY: ${{ secrets.QUANTOS_SIGNING_KEY }}
          QUANTOS_REQUIRE_FORMAL_SIGNATURE: "1"
        run: bash scripts/sign-artifacts.sh artifacts/release/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: quantos-build-artifacts
          path: |
            artifacts/release/
            artifacts/signatures/
          if-no-files-found: error

  verify-download-main:
    needs: sign-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: f02-signing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - uses: actions/download-artifact@v4
        with:
          name: quantos-build-artifacts
          path: artifacts
      - name: Verify downloaded payload and formal signature; record receipt
        env:
          QUANTOS_SIGNING_KEY: ${{ secrets.QUANTOS_SIGNING_KEY }}
        run: node scripts/write-f02-ci-receipt.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: f02-download-receipt
          path: artifacts/f02/download-receipt.json
          if-no-files-found: error

  verify-download-pr:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - uses: actions/download-artifact@v4
        with:
          name: quantos-build-inputs
          path: artifacts
      - name: Verify PR payload without signing credentials
        env:
          QUANTOS_DOWNLOADED_ARTIFACT: quantos-build-inputs
        run: node scripts/write-f02-ci-receipt.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: f02-download-receipt
          path: artifacts/f02/download-receipt.json
          if-no-files-found: error

  # Stable required-check name: a skipped upstream job never counts as acceptance.
  verify-download:
    needs: [verify-download-main, verify-download-pr]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require the event-specific download verification
        env:
          MAIN_RESULT: ${{ needs.verify-download-main.result }}
          PR_RESULT: ${{ needs.verify-download-pr.result }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            test "$MAIN_RESULT" = success
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            test "$PR_RESULT" = success
          else
            exit 1
          fi
