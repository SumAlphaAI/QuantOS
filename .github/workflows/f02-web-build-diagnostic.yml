name: F02 Web Build Diagnostic
on:
  workflow_dispatch:
    inputs:
      source:
        description: Full source commit SHA (empty uses the workflow checkout)
        required: false
        type: string
      runs:
        description: Number of fresh builds (2 to 20); diagnostic only
        default: "6"
        type: string
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - run: corepack enable pnpm
      - run: node scripts/capture-web-builds.mjs
        env:
          QUANTOS_DIAGNOSTIC_SOURCE: ${{ inputs.source }}
          QUANTOS_DIAGNOSTIC_RUNS: ${{ inputs.runs }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f02-web-build-diagnostic
          path: artifacts/web-build-diagnostic/
          if-no-files-found: error
