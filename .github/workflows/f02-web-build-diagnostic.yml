name: F02 Web Build Diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/f02-web-build-diagnostic.yml
      - scripts/capture-web-builds.mjs
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - run: corepack enable pnpm
      - run: node scripts/capture-web-builds.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f02-web-build-diagnostic
          path: artifacts/web-build-diagnostic/
          if-no-files-found: error
