name: F02 Web Build Diagnostic
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/f02-web-build-diagnostic.yml
      - scripts/capture-web-builds.mjs
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - run: corepack enable pnpm
      - run: node scripts/capture-web-builds.mjs
        env:
          QUANTOS_DIAGNOSTIC_SOURCE: ac73a95a758cc95385b69e9d6f9376cef4a2af0b
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f02-web-build-diagnostic
          path: artifacts/web-build-diagnostic/
          if-no-files-found: error
  minifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/diagnose-f02-minifier.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f02-minifier-diagnostic
          path: artifacts/minifier-diagnostic/
          if-no-files-found: error
