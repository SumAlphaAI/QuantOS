name: F01 Clean Room

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [clean-room, reproducibility]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.0"
      - run: corepack enable pnpm
      - name: Verify isolated source snapshot
        run: node scripts/verify-reproducible-builds.mjs --mode ${{ matrix.mode }} --runs 3 --capture-web-outputs --output artifacts/reproducibility/f01-${{ matrix.mode }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f01-${{ matrix.mode }}-evidence
          path: |
            artifacts/reproducibility/f01-${{ matrix.mode }}.json
            artifacts/reproducibility/*.web-outputs/
          if-no-files-found: error
