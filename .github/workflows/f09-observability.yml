name: F09 Observability Gate

on:
  pull_request:
  push:
    branches: [main, "codex/f09-remediation"]
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"

permissions:
  contents: read

jobs:
  local-observability:
    runs-on: ubuntu-24.04
    env:
      QUANTOS_SKIP_ENV: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.0"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --project engines --all-packages
      - name: Trace, Engine and ADR static Gate
        run: make observability-check

  supabase-target:
    if: github.event_name != 'pull_request'
    needs: local-observability
    runs-on: ubuntu-24.04
    env:
      QUANTOS_SKIP_ENV: "1"
      DATABASE_URL: ${{ secrets.F09_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.F09_SUPABASE_URL }}
      F09_CA_PEM: ${{ secrets.F09_CA_PEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.0"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --project engines --all-packages
      - name: Verify target configuration and write CA file
        run: |
          test -n "$DATABASE_URL" && test -n "$SUPABASE_URL" && test -n "$F09_CA_PEM"
          printf '%s\n' "$F09_CA_PEM" > "$RUNNER_TEMP/f09-ca.pem"
          echo "QUANTOS_BFF_SSLROOTCERT=$RUNNER_TEMP/f09-ca.pem" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs = require('node:fs');
          const caPath = `${process.env.RUNNER_TEMP}/f09-ca.pem`;
          for (const name of ['DATABASE_URL']) {
            const url = new URL(process.env[name]);
            url.searchParams.set('sslmode', 'verify-full');
            url.searchParams.set('sslrootcert', caPath);
            fs.appendFileSync(process.env.GITHUB_ENV, `${name}=${url.toString()}\n`);
          }
          NODE
      - name: Same SHA Supabase PostgreSQL Gate
        run: make f09-target-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f09-supabase-${{ github.sha }}
          path: artifacts/f09/
          if-no-files-found: warn
