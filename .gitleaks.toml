title = "QuantOS gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Allow placeholder documentation secrets"
paths = [
  '''\.env\.example$''',
  '''THIRD_PARTY_NOTICES\.md$''',
]

[[allowlists]]
description = "Allow placeholder connection strings in examples"
regexes = [
  '''YOUR_PASSWORD''',
  '''your-project-ref''',
  '''reset_remote_schema''',
]

[[allowlists]]
description = "Verified SHA256 source digests for BFF-FE-001; exact values only"
regexTarget = "secret"
regexes = [
  '''^c71b5f3896893c7cdf4cb93647bde334601eaad51707f55eeb132757a2910cc9$''',
  '''^b76aa57ab00e839336612c50bc2cc9ff273e896d16f9ec0a33d7b7484ac638b8$''',
  '''^76cd89e5eb133d2077b1b33264167fc451f170f989951b82f7371c5ac83d1646$''',
  '''^c9e069eb1a9f0eab36397d90ff0a63136ea86d29411e51c440bc87eaeba70c5e$''',
]
