components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: quantos_session
      description: BFF 服务端会话；Set-Cookie 必须使用 Secure、HttpOnly、SameSite=Strict，浏览器不得持久化 bearer token
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: 不透明分页游标
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Sort:
      name: sort
      in: query
      schema:
        type: string
      description: 服务端排序表达式；允许值由具体 operation 明确列出，未知字段返回 422
    Filter:
      name: filter
      in: query
      schema:
        type: string
      description: 服务端过滤表达式；仅接受具体 operation allowlist 中的字段
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 同一业务意图重试必须复用同一键；服务端按（actor, key）去重
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: expectedVersion（objectVersion）；不匹配返回 409 + currentVersion
    AfterSequence:
      name: afterSequence
      in: query
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
      description: 只推送 sequence 严格大于该值的事件（断线回补）
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 16
      description: 与 SameSite CSRF cookie 绑定的双提交 token；BFF 同时校验 Origin allowlist
    ClientRequestId:
      name: X-Request-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Opaque client attempt ID; BFF injects tenant/workspace/actor from the session.
  headers:
    X-Correlation-Id:
      schema:
        type: string
        format: uuid
      description: 全链路追踪 ID；错误页可复制提交支持
    ETag:
      schema:
        type: string
      description: 当前对象版本；后续可变写使用 If-Match 原样回传
  responses:
    Unauthorized:
      description: 会话失效/未认证；客户端清空内存态并跳登录（不泄露细节）
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
          description: Restricted responses must not be stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: UNAUTHENTICATED
            message: 会话已失效，请重新登录。
            correlationId: 9a1c4e60-2d3b-4c5f-8a9e-1b2c3d4e5f60
    Forbidden:
      description: 无权限（规范文案；涉密钥/受限审计/高风险不返回内容）
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
          description: Restricted responses must not be stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: FORBIDDEN
            message: 你没有访问此资源的权限。若认为这是错误，请联系主工作区管理员。
            correlationId: 4d5e6f70-8a9b-4c1d-2e3f-5a6b7c8d9e0f
    NotFound:
      description: 不存在或未授权（不区分，防存在性泄露）
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
          description: Restricted responses must not be stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: NOT_FOUND
            message: 未找到该资源。
            correlationId: 4d5e6f70-8a9b-4c1d-2e3f-5a6b7c8d9e0f
    Conflict:
      description: 版本/状态/有效期冲突；返回 currentVersion，客户端保留本地草稿并刷新
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
          description: Restricted responses must not be stored.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - if:
                  properties:
                    code:
                      const: VERSION_CONFLICT
                then:
                  required:
                    - currentVersion
    Unprocessable:
      description: 校验失败（字段级 fieldErrors；含超预算/过期数据/未批准 capability 等原因）
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
          description: Restricted responses must not be stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: 限流（retryAfter 秒；不泄露账户存在性）
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
          description: Restricted responses must not be stored.
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/ErrorEnvelope"
              - required:
                  - retryAfter
    Gone:
      description: 受控资源已过期并不再可用；需重新创建导出
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
          description: Restricted responses must not be stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ServerError:
      description: Safe upstream/internal failure; unknown codes fail closed.
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/X-Correlation-Id"
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
          description: Restricted responses must not be stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          example:
            code: SERVICE_UNAVAILABLE
            message: 服务暂不可用，请稍后重试。
            correlationId: 11111111-1111-4111-8111-111111111111
  schemas:
    AssistedNativeCapabilities:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - actorId
        - tenantId
        - workspaceId
        - accountId
        - mode
        - serverFlagEnabled
        - targetEnabled
        - canRequest
        - canApprove
        - executionAuthority
        - policyVersion
        - policyRevision
        - checkedAt
        - expiresAt
      properties:
        schemaVersion:
          type: string
          enum:
            - quantos-assisted-testnet-capabilities.v1
        actorId:
          $ref: "#/components/schemas/UUID"
        tenantId:
          $ref: "#/components/schemas/UUID"
        workspaceId:
          $ref: "#/components/schemas/UUID"
        accountId:
          $ref: "#/components/schemas/UUID"
        mode:
          type: string
          enum:
            - paper
            - shadow
            - assisted_live
        serverFlagEnabled:
          type: boolean
        targetEnabled:
          type: boolean
        canRequest:
          type: boolean
        canApprove:
          type: boolean
        executionAuthority:
          type: boolean
          enum:
            - false
        policyRevision:
          type: integer
          minimum: 1
        policyVersion:
          type: string
          enum:
            - core-l03-local.v1
        checkedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        reconciliationReaderEnabled:
          type: boolean
    AssistedSubject:
      type: object
      additionalProperties: false
      required:
        - subjectId
        - subjectHash
        - proposalHash
        - decisionId
        - originator
        - accountId
        - symbol
        - side
        - quantity
        - limitPrice
        - expiresAt
      properties:
        subjectId:
          $ref: "#/components/schemas/UUID"
        subjectHash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        proposalHash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        decisionId:
          $ref: "#/components/schemas/UUID"
        originator:
          $ref: "#/components/schemas/UUID"
        accountId:
          $ref: "#/components/schemas/UUID"
        symbol:
          type: string
          minLength: 1
          maxLength: 20
        side:
          type: string
          enum:
            - buy
            - sell
        quantity:
          $ref: "#/components/schemas/DecimalValue"
        limitPrice:
          $ref: "#/components/schemas/DecimalValue"
        expiresAt:
          type: string
          format: date-time
    AssistedApprovalRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - requesterId
        - subjectId
        - subjectHash
        - policyVersion
        - revision
        - status
        - approvers
        - expiresAt
        - notional
        - executionAuthority
      properties:
        requesterId:
          $ref: "#/components/schemas/UUID"
        requestId:
          $ref: "#/components/schemas/UUID"
        subjectId:
          $ref: "#/components/schemas/UUID"
        subjectHash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        policyVersion:
          type: string
          minLength: 1
          maxLength: 20
        revision:
          type: integer
          minimum: 0
          maximum: 2
        status:
          type: string
          enum:
            - pending
            - awaiting_second
            - approved
        approvers:
          type: array
          items:
            $ref: "#/components/schemas/UUID"
          maxItems: 2
        expiresAt:
          type: string
          format: date-time
        notional:
          $ref: "#/components/schemas/DecimalValue"
        executionAuthority:
          type: boolean
          enum:
            - false
    AssistedNativeOrder:
      type: object
      additionalProperties: false
      required:
        - orderId
        - commandId
        - accountId
        - symbol
        - side
        - quantity
        - filledQuantity
        - status
      properties:
        orderId:
          type: string
          minLength: 1
          maxLength: 128
        commandId:
          $ref: "#/components/schemas/UUID"
        accountId:
          $ref: "#/components/schemas/UUID"
        symbol:
          type: string
          minLength: 1
          maxLength: 20
        side:
          type: string
          enum:
            - buy
            - sell
        quantity:
          $ref: "#/components/schemas/DecimalValue"
        filledQuantity:
          $ref: "#/components/schemas/DecimalValue"
        status:
          type: string
          minLength: 1
          maxLength: 32
    AssistedNativeCommand:
      type: object
      additionalProperties: false
      required:
        - requestId
        - subjectHash
        - commandId
        - expiresAt
        - state
        - signature
      properties:
        requestId:
          $ref: "#/components/schemas/UUID"
        subjectHash:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
        commandId:
          $ref: "#/components/schemas/UUID"
        expiresAt:
          type: string
          format: date-time
        state:
          type: string
          enum:
            - accepted
            - unknown
        signature:
          type: string
          pattern: ^[a-f0-9]{64}$
        order:
          $ref: "#/components/schemas/AssistedNativeOrder"
    AssistedObservedOrder:
      type: object
      additionalProperties: false
      required:
        - orderId
        - commandId
        - accountId
        - symbol
        - side
        - quantity
        - filledQuantity
        - averageFillPrice
        - status
        - submittedAt
        - updatedAt
      properties:
        orderId:
          type: string
          minLength: 1
          maxLength: 128
        commandId: &a1
          $ref: "#/components/schemas/UUID"
        accountId: *a1
        symbol:
          type: string
          minLength: 1
          maxLength: 20
        side:
          type: string
          enum:
            - buy
            - sell
        quantity: &a2
          $ref: "#/components/schemas/DecimalValue"
        filledQuantity: *a2
        averageFillPrice:
          anyOf:
            - $ref: "#/components/schemas/DecimalValue"
            - type: "null"
        status:
          type: string
          minLength: 1
          maxLength: 32
        submittedAt: &a3
          $ref: "#/components/schemas/DateTime"
        updatedAt: *a3
    AssistedObservedFill:
      type: object
      additionalProperties: false
      required:
        - fillId
        - orderId
        - commandId
        - accountId
        - symbol
        - side
        - quantity
        - price
        - feeCurrency
        - feeAmount
        - filledAt
        - factHash
      properties:
        fillId:
          type: string
          minLength: 1
          maxLength: 128
        orderId:
          type: string
          minLength: 1
          maxLength: 128
        commandId: *a1
        accountId: *a1
        symbol:
          type: string
          minLength: 1
          maxLength: 20
        side:
          type: string
          enum:
            - buy
            - sell
        quantity: *a2
        price: *a2
        feeCurrency:
          type: string
          minLength: 1
          maxLength: 20
        feeAmount: *a2
        filledAt: *a3
        factHash: &a4
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
    AssistedExecutionFacts:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - requestId
        - subjectHash
        - tenantId
        - workspaceId
        - accountId
        - commandId
        - decisionId
        - proposalHash
        - quoteCurrency
        - outcome
        - journalAvailable
        - consumerReady
        - reason
        - order
        - fills
        - factHashes
        - nativeSourceHashes
        - sourceHash
        - recordedAt
        - executionAuthority
      properties:
        schemaVersion:
          type: string
          enum:
            - quantos-native-execution-facts.v1
        requestId: *a1
        subjectHash: *a4
        tenantId: *a1
        workspaceId: *a1
        accountId: *a1
        commandId: *a1
        decisionId: *a1
        proposalHash: *a4
        quoteCurrency:
          type: string
          enum: [ USDT ]
        outcome:
          type: string
          enum:
            - accepted
            - unknown
        journalAvailable: &a5
          type: boolean
        consumerReady: *a5
        reason:
          type: string
          enum:
            - OBSERVED_NATIVE_FACTS
            - OUTCOME_UNRESOLVED
            - JOURNAL_UNAVAILABLE
            - FEE_CONVERSION_REQUIRED
        order:
          anyOf:
            - $ref: "#/components/schemas/AssistedObservedOrder"
            - type: "null"
        fills:
          type: array
          maxItems: 10000
          items:
            $ref: "#/components/schemas/AssistedObservedFill"
        factHashes:
          type: array
          maxItems: 20002
          items: *a4
        nativeSourceHashes:
          type: array
          maxItems: 20002
          items: *a4
        sourceHash: *a4
        recordedAt: *a3
        executionAuthority:
          type: boolean
          enum:
            - false
    AssistedRequestView:
      type: object
      additionalProperties: false
      required:
        - request
        - subject
      properties:
        request:
          $ref: "#/components/schemas/AssistedApprovalRequest"
        subject:
          $ref: "#/components/schemas/AssistedSubject"
        command:
          $ref: "#/components/schemas/AssistedNativeCommand"
        facts:
          $ref: "#/components/schemas/AssistedExecutionFacts"
        ledger:
          $ref: "#/components/schemas/AssistedLedgerReceipt"
    AssistedSubjectList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssistedSubject"
          maxItems: 50
    AssistedRequestList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AssistedRequestView"
          maxItems: 200
    AssistedApprovalAudit:
      type: object
      additionalProperties: false
      required:
        - items
        - verified
        - nativeSubmissions
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - sequence
              - requestId
              - subjectHash
              - actorId
              - userId
              - slot
              - signature
            properties:
              sequence:
                type: integer
                minimum: 1
              requestId:
                $ref: "#/components/schemas/UUID"
              subjectHash:
                type: string
                pattern: ^sha256:[a-f0-9]{64}$
              actorId:
                $ref: "#/components/schemas/UUID"
              userId:
                $ref: "#/components/schemas/UUID"
              slot:
                type: integer
                enum:
                  - 1
                  - 2
              signature:
                type: string
                pattern: ^[a-f0-9]{64}$
          maxItems: 2
        verified:
          type: boolean
          enum:
            - true
        nativeSubmissions:
          type: integer
          minimum: 0
    OpenAssistedRequest:
      type: object
      additionalProperties: false
      required:
        - subjectId
      properties:
        subjectId:
          $ref: "#/components/schemas/UUID"
    ApproveAssistedRequest:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
        - mfaChallengeRef
        - reauthTokenRef
      properties:
        expectedRevision:
          type: integer
          minimum: 0
          maximum: 1
        mfaChallengeRef:
          type: string
          minLength: 1
          maxLength: 128
        reauthTokenRef:
          type: string
          minLength: 1
          maxLength: 128
    SubmitAssistedRequest:
      type: object
      additionalProperties: false
      required:
        - expectedRevision
      properties:
        expectedRevision:
          type: integer
          enum:
            - 2

    UUID:
      type: string
      format: uuid
    DateTime:
      type: string
      format: date-time
      description: RFC 3339 UTC
    DecimalValue:
      type: string
      pattern: ^-?\d+(\.\d+)?$
      description: 十进制定点字符串（proto DecimalValue.value；禁 IEEE-754 交易计算）
    MoneyValue:
      type: object
      required:
        - currencyCode
        - units
        - nanos
      properties:
        currencyCode:
          type: string
          pattern: ^[A-Z]{3}$
        units:
          type: string
          format: int64
        nanos:
          type: integer
          minimum: -999999999
          maximum: 999999999
    RuntimeMode:
      type: string
      enum:
        - research
        - paper
        - shadow
        - assisted_live
      description: assisted_live 仅 M5+ 且服务端 flag/capability 放行才可见；客户端不得硬编码可用性
    Environment:
      type: string
      enum:
        - dev
        - staging
        - prod
    DataQuality:
      type: string
      enum:
        - verified
        - provisional
        - degraded
        - failed
        - expired
        - license_missing
      description: 未知值客户端显示"未知/需升级"并阻断高风险动作
    TaskStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - cancelled
        - cancel_requested
    OrderStatus:
      type: string
      enum:
        - draft
        - risk_checking
        - awaiting_approval
        - command_ready
        - submitted
        - accepted
        - partially_filled
        - filled
        - cancelled
        - rejected
        - expired
    TimeWindow:
      type: object
      required:
        - start
        - end
      properties:
        start:
          $ref: "#/components/schemas/DateTime"
        end:
          $ref: "#/components/schemas/DateTime"
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - correlationId
      properties:
        code:
          type: string
          description: 稳定机器码，如 FORBIDDEN/VERSION_CONFLICT/COMMAND_EXPIRED/DATA_STALE
        message:
          type: string
          description: 安全可展示文案（i18n key 由客户端映射）
        correlationId:
          $ref: "#/components/schemas/UUID"
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        retryAfter:
          type: integer
          minimum: 0
          description: 秒
        currentVersion:
          type: string
          description: 409 时返回，供客户端 diff
        conflictDiff:
          type: object
          properties:
            files:
              type: object
              additionalProperties:
                type: string
            parameters:
              type: object
              additionalProperties: true
          required:
            - files
            - parameters
          additionalProperties: false
      additionalProperties: false
    Page:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type: string
          description: 缺省表示末页
    AsyncAccepted:
      type: object
      required:
        - jobId
        - status
        - correlationId
      properties:
        jobId:
          $ref: "#/components/schemas/UUID"
        status:
          type: string
          enum:
            - accepted
            - cancel_requested
        correlationId:
          $ref: "#/components/schemas/UUID"
        auditRef:
          $ref: "#/components/schemas/UUID"
    AuditedAsyncAccepted:
      allOf:
        - $ref: "#/components/schemas/AsyncAccepted"
        - type: object
          required:
            - auditRef
          properties:
            auditRef:
              $ref: "#/components/schemas/UUID"
            mfaEnrollment:
              $ref: "#/components/schemas/MfaEnrollment"
    MfaEnrollment:
      type: object
      required:
        - factorRef
        - delivery
      properties:
        factorRef:
          $ref: "#/components/schemas/UUID"
        delivery:
          type: string
          enum:
            - one_time
            - restart_required
        uri:
          type: string
          description: One-time otpauth enrollment URI for the authenticated user only; never persist, log, cache or send to analytics. Idempotent job replay omits this material.
      additionalProperties: false
    ReauthRequest:
      type: object
      required:
        - challengeRef
      properties:
        challengeRef:
          $ref: "#/components/schemas/UUID"
      additionalProperties: false
    StreamEvent:
      type: object
      required:
        - streamId
        - sequence
        - eventId
        - occurredAt
        - correlationId
        - payloadVersion
        - payload
      properties:
        streamId:
          $ref: "#/components/schemas/UUID"
        sequence:
          type: integer
          format: int64
          minimum: 1
        eventId:
          $ref: "#/components/schemas/UUID"
        occurredAt:
          $ref: "#/components/schemas/DateTime"
        correlationId:
          $ref: "#/components/schemas/UUID"
        payloadVersion:
          type: string
          description: Canonical v1; legacy 1 remains supported during the 1.4.0 migration window. Other versions fail closed.
          enum:
            - v1
            - "1"
        payload:
          type: object
          description: 领域事件载荷；payload.type=permission_revoked 为终态语义
    SessionContext:
      type: object
      required:
        - actorId
        - tenantId
        - workspaceId
        - accountId
        - mode
        - environment
        - capabilities
        - mfaState
        - expiresAt
      properties:
        actorId:
          $ref: "#/components/schemas/UUID"
        tenantId:
          $ref: "#/components/schemas/UUID"
        workspaceId:
          $ref: "#/components/schemas/UUID"
        accountId:
          $ref: "#/components/schemas/UUID"
        mode:
          $ref: "#/components/schemas/RuntimeMode"
        environment:
          $ref: "#/components/schemas/Environment"
        capabilities:
          type: array
          items:
            type: string
          description: capability key 全集（权限裁剪唯一来源）
        mfaState:
          type: string
          enum:
            - unenrolled
            - enrolled
            - challenged
            - verified
        expiresAt:
          $ref: "#/components/schemas/DateTime"
    ProfileSettingsInput:
      type: object
      required:
        - displayName
        - locale
        - timezone
        - theme
        - numberFormat
        - timeDisplay
        - defaultRoute
        - density
        - highContrast
        - reducedMotion
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 80
        title:
          type: string
          maxLength: 120
        team:
          type: string
          maxLength: 120
        locale:
          type: string
          enum:
            - zh-CN
            - en
        timezone:
          type: string
          description: IANA timezone
        theme:
          type: string
          enum:
            - system
            - dark
            - light
        numberFormat:
          type: string
          enum:
            - comma_dot
            - space_comma
        timeDisplay:
          type: string
          enum:
            - utc_local
            - local
        defaultRoute:
          type: string
          enum:
            - /command
            - /research
            - /portfolio
            - /markets
        density:
          type: string
          enum:
            - compact
            - comfortable
