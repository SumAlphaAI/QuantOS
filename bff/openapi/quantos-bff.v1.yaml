openapi: 3.1.0
info:
  title: QuantOS Terminal BFF API
  version: 1.3.0
  description: |
    BFF-FE-000 基线（2026-08-14 BFF TL 评审通过并冻结为 1.0.0）。
    变更策略：只加不破——新增 optional 字段/新端点走 minor；破坏性变更走 /v2。

    范围：GAP-00 统一基线 + C01、C03–C09，以及 UI-104 所需 C17 Settings/Web Platform 面。
    C01/C17 P15 已有 BFF-FE-001 本地参考 provider，需 staging 消费者/provider 签署后方可标记 Integrated；P16 由 BFF-FE-011 负责。
    C02/C10–C16 与未发布补充 operationId 由 bff/page-operation-catalog.yaml 冻结命名，
    但在后续 BFF-FE owner 任务发布 path/schema/provider 前不得视为本 OpenAPI 已实现。

    统一约定：
    - 成功响应：单资源直接返回；列表返回 Page<T>（items + nextCursor）。
    - 错误响应：一律 ErrorEnvelope（code/message/correlationId[/fieldErrors/retryAfter/currentVersion]）。
    - 分页：cursor + pageSize（默认 50，上限 200）；游标不透明，不作为领域数据。
    - 命令：POST 动作风格；异步一律 202 + AsyncAccepted；写操作必须携带 Idempotency-Key 头；
      可变对象写必须携带 If-Match（objectVersion），冲突返回 409 + currentVersion，客户端保留草稿不覆盖。
    - 实时：GET + Accept: text/event-stream，afterSequence 续传；事件信封 StreamEvent
      （与 packages/api-client/src/sse.ts PoC 一致）；权限撤销以 payload.type=permission_revoked
      或重连 403 终态关闭。
    - 所有响应携带 X-Correlation-Id 头；BFF 注入 tenant/workspace/actor，客户端不发送。
    - 数值：decimal 以字符串序列化（十进制定点，禁 IEEE-754 交易计算）；时间 RFC 3339 UTC。
servers:
  - url: https://bff.staging.sumalpha.ai
    description: staging
  - url: http://localhost:8080
    description: local-integrated
  - url: http://localhost:4010
    description: local-mock（MSW 拦截）
tags:
  - name: session
    description: C01 会话与上下文
  - name: research
    description: C03 Research Runtime
  - name: data
    description: C04 数据快照与 Artifact
  - name: strategy
    description: C05 策略草稿/回测/Release
  - name: risk
    description: C06 Portfolio 与 Risk
  - name: proposal
    description: C07 TradeProposal 与风险评估
  - name: approval
    description: C08 审批与 MFA
  - name: execution
    description: C09 TradeCommand 与 Order
  - name: settings
    description: C17 资料、安全、通知与 Web 平台能力

security:
  - cookieAuth: []

paths:
  # ==================== C01 Session/Context ====================
  /v1/session:
    get:
      operationId: getSession
      tags: [session]
      summary: 当前会话与 MFA 状态
      responses:
        "200":
          description: 会话信息
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionContext" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/context:
    get:
      operationId: getContext
      tags: [session]
      summary: 主工作区/账户上下文与 capability 集合（权限裁剪的唯一来源）
      responses:
        "200":
          description: 上下文
          headers:
            X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionContext" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /v1/auth/reauth:
    post:
      operationId: reauth
      tags: [session]
      summary: 近期登录再认证（高风险操作前置）
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReauthRequest" }
      responses:
        "200":
          description: 再认证通过，返回新的 reauthTokenRef（短时）
          content:
            application/json:
              schema:
                type: object
                required: [reauthTokenRef, expiresAt]
                properties:
                  reauthTokenRef: { type: string, format: uuid }
                  expiresAt: { $ref: "#/components/schemas/DateTime" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/mfa/challenges:
    post:
      operationId: mfaChallenge
      tags: [session]
      summary: 发起/完成 MFA challenge（失败限流且不泄露账户存在性）
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [purpose]
              properties:
                purpose: { type: string, enum: [login, approval, kill_switch, security_change] }
                code: { type: string, description: 完成 challenge 时提交；发起时缺省 }
      responses:
        "200":
          description: challenge 状态
          content:
            application/json:
              schema:
                type: object
                required: [challengeRef, status]
                properties:
                  challengeRef: { type: string, format: uuid }
                  status: { type: string, enum: [pending, verified, failed] }
        "429": { $ref: "#/components/responses/RateLimited" }
  /v1/auth/logout:
    post:
      operationId: logout
      tags: [session]
      summary: 注销并服务端吊销会话
      parameters:
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: 已注销 }
  /v1/access-requests:
    post:
      operationId: submitAccessRequest
      tags: [session]
      summary: 访问申请（访客；防滥用限速 + 隐私告知版本）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamName, contactEmail, purpose, markets, expectedMode, privacyNoticeVersion]
              properties:
                teamName: { type: string }
                contactEmail: { type: string, format: email }
                purpose: { type: string }
                markets: { type: array, items: { type: string } }
                expectedMode: { $ref: "#/components/schemas/RuntimeMode" }
                privacyNoticeVersion: { type: string }
      responses:
        "202":
          description: 受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditedAsyncAccepted" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "429": { $ref: "#/components/responses/RateLimited" }

  # ==================== C17 Settings / Web Platform (1.2 reference provider) ====================
  /v1/settings/profile:
    get:
      operationId: getProfile
      tags: [settings]
      summary: 当前成员资料与区域显示偏好
      responses:
        "200":
          description: 资料设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      operationId: saveProfile
      tags: [settings]
      summary: 保存资料与区域显示偏好；不得改变角色、权限或风险规则
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileSettingsInput" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileSettings" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/settings/notification-preferences:
    get:
      operationId: getNotificationPrefs
      tags: [settings]
      responses:
        "200":
          description: 通知偏好矩阵
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
    put:
      operationId: saveNotificationPrefs
      tags: [settings]
      parameters:
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferencesInput" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/settings/security:
    get:
      operationId: getSecuritySettings
      tags: [settings]
      responses:
        "200":
          description: MFA 与安全姿态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/settings/sessions:
    get:
      operationId: listSessions
      tags: [settings]
      responses:
        "200":
          description: 活跃会话（IP 必须脱敏）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActiveSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/settings/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      tags: [settings]
      summary: 撤销单个非当前会话；要求近期认证并写审计
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
        - { name: X-Reauth-Token-Ref, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: 撤销已受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditedAsyncAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/settings/sessions/stream:
    get:
      operationId: subscribeSessionRevocations
      tags: [settings]
      parameters:
        - { $ref: "#/components/parameters/AfterSequence" }
      responses:
        "200":
          description: 会话撤销/失效 SSE；当前会话被撤销为终态并清空内存认证态
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/StreamEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/settings/trusted-devices:
    get:
      operationId: listDevices
      tags: [settings]
      responses:
        "200":
          description: 可信设备
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TrustedDevice" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/settings/trusted-devices/{deviceId}:
    delete:
      operationId: revokeDevice
      tags: [settings]
      summary: 撤销设备信任；不得撤销最后有效 MFA 因素
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
        - { name: X-Reauth-Token-Ref, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: 撤销已受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditedAsyncAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/settings/mfa/setup:
    post:
      operationId: setupMfa
      tags: [settings]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
        - { name: X-Reauth-Token-Ref, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [passkey, authenticator] }
      responses:
        "202":
          description: MFA 设置流程已受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditedAsyncAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/settings/mfa/factors/{factorId}:
    delete:
      operationId: revokeMfaFactor
      tags: [settings]
      summary: 撤销 MFA 因素；最后有效因素必须返回 409 且不得修改状态
      parameters:
        - { name: factorId, in: path, required: true, schema: { type: string } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
        - { name: X-Reauth-Token-Ref, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: 因素撤销已受理；auditRef 可追踪安全审计记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditedAsyncAccepted" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/settings/downloads:
    get:
      operationId: listDownloads
      tags: [settings]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: 下载记录；URL 必须短时、签名且服务端鉴权
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DownloadRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/platform/browser-capabilities:
    get:
      operationId: getPlatformCapabilities
      tags: [settings]
      summary: Web adapter 服务端约束；客户端本地检测只能缩小能力，不得扩大授权
      responses:
        "200":
          description: Web 平台能力策略
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserCapabilityPolicy" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ==================== C03 Research Runtime ====================
  /v1/research-runs:
    get:
      operationId: listResearchRuns
      tags: [research]
      summary: 研究任务列表（服务端分页/筛选/排序）
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TaskStatus" } }
        - { name: dataSnapshotId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 任务页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/ResearchRun" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createResearchRun
      tags: [research]
      summary: 创建研究任务（幂等；capability/快照/预算/deadline 服务端校验）
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capability, dataSnapshotId, question, budget, deadlineAt]
              properties:
                capability: { type: string }
                dataSnapshotId: { type: string, format: uuid }
                question: { type: string }
                budget: { $ref: "#/components/schemas/DecimalValue" }
                deadlineAt: { $ref: "#/components/schemas/DateTime" }
                attachments: { type: array, items: { type: string, format: uuid }, description: 已上传扫描后的 Artifact 引用 }
      responses:
        "202":
          description: 受理（不代表完成）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AsyncAccepted" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/research-runs/{runId}:
    get:
      operationId: getResearchRun
      tags: [research]
      summary: 任务详情（含 Evidence：快照/Engine/hash/成本/correlationId）
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResearchRun" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/research-runs/{runId}/cancel:
    post:
      operationId: cancelResearchRun
      tags: [research]
      summary: 请求取消（202 受理；终态以流/详情为准，不伪造已取消）
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202":
          description: 取消已受理（cancel_requested）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AsyncAccepted" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/research-runs/{runId}/stream:
    get:
      operationId: subscribeResearchRun
      tags: [research]
      summary: 任务事件流（SSE；sequence 去重，afterSequence 回补）
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/AfterSequence" }
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/StreamEvent" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ==================== C04 Snapshot/Artifact ====================
  /v1/data-snapshots:
    get:
      operationId: listDataSnapshots
      tags: [data]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: quality, in: query, schema: { $ref: "#/components/schemas/DataQuality" } }
      responses:
        "200":
          description: 快照页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/DataSnapshot" }
  /v1/data-snapshots/{snapshotId}:
    get:
      operationId: getDataSnapshot
      tags: [data]
      summary: 快照详情（质量/血缘/许可；质量受限由服务端返回阻断标识，前端不可覆盖）
      parameters:
        - { name: snapshotId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataSnapshot" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/artifacts/{artifactId}:
    get:
      operationId: getArtifact
      tags: [data]
      summary: Artifact 详情（版本/环境 hash/血缘；资源级授权，无权按 404）
      parameters:
        - { name: artifactId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Artifact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Artifact" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ==================== C05 Strategy ====================
  /v1/strategies:
    get:
      operationId: listStrategies
      tags: [strategy]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: 策略页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/StrategySummary" }
  /v1/strategies/{strategyId}/draft:
    get:
      operationId: getStrategyDraft
      tags: [strategy]
      parameters:
        - { name: strategyId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 草稿（携带 objectVersion/ETag）
          headers:
            ETag: { schema: { type: string }, description: objectVersion }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyDraft" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: saveStrategyDraft
      tags: [strategy]
      summary: 保存草稿（If-Match=expectedVersion；409 返回 currentVersion，客户端保留草稿不覆盖）
      parameters:
        - { name: strategyId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [files, parameters]
              properties:
                files: { type: object, additionalProperties: { type: string } }
                parameters: { type: object }
      responses:
        "200":
          description: 已保存，返回新 objectVersion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyDraft" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/strategies/{strategyId}/static-checks:
    post:
      operationId: runStaticCheck
      tags: [strategy]
      summary: 静态检查（look-ahead/依赖/数据快照阻断原因）
      parameters:
        - { name: strategyId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202":
          description: 受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AsyncAccepted" }
  /v1/backtests:
    post:
      operationId: createBacktest
      tags: [strategy]
      summary: 发起回测（固定快照与 clock；202 受理）
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [strategyId, objectVersion, dataSnapshotId]
              properties:
                strategyId: { type: string, format: uuid }
                objectVersion: { type: string }
                dataSnapshotId: { type: string, format: uuid }
      responses:
        "202":
          description: 受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AsyncAccepted" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/backtests/{runId}:
    get:
      operationId: getBacktest
      tags: [strategy]
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 回测报告（指标/泄漏检查/验证结果）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestReport" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/releases:
    get:
      operationId: listReleases
      tags: [strategy]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: Release 页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/StrategyRelease" }
    post:
      operationId: createRelease
      tags: [strategy]
      summary: 创建不可变 Release（泄漏检查失败阻断；返回 content hash）
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [strategyId, objectVersion, backtestRunId, parameters]
              properties:
                strategyId: { type: string, format: uuid }
                objectVersion: { type: string }
                backtestRunId: { type: string, format: uuid }
                parameters: { type: object }
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyRelease" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/releases/{releaseId}:
    get:
      operationId: getRelease
      tags: [strategy]
      summary: Release 详情（allowedTargets 由服务端返回；M3/M4 仅 paper/shadow）
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyRelease" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/releases/{releaseId}/approval-submissions:
    post:
      operationId: submitReleaseApproval
      tags: [strategy]
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202":
          description: 已进入审批
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AsyncAccepted" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/releases/{releaseId}/rollback-requests:
    post:
      operationId: requestReleaseRollback
      tags: [strategy]
      parameters:
        - { name: releaseId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetReleaseId]
              properties:
                targetReleaseId: { type: string, format: uuid }
      responses:
        "202":
          description: 受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AsyncAccepted" }

  # ==================== C06 Portfolio/Risk ====================
  /v1/portfolio:
    get:
      operationId: getPortfolio
      tags: [risk]
      summary: 组合视图（asOf/stale；陈旧时命令类操作由服务端拒绝）
      parameters:
        - { name: accountId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 组合视图
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioView" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/risk:
    get:
      operationId: getRiskView
      tags: [risk]
      parameters:
        - { name: accountId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 风险视图（预算/命中规则/kill switch 状态）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskView" }
  /v1/risk/kill-switch/engage:
    post:
      operationId: engageKillSwitch
      tags: [risk]
      summary: 触发 kill switch（DangerConfirm + MFA + reauthTokenRef + 服务端签名）
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, reason, mfaChallengeRef, reauthTokenRef, confirmPhrase]
              properties:
                accountId: { type: string, format: uuid }
                reason: { type: string }
                mfaChallengeRef: { type: string, format: uuid }
                reauthTokenRef: { type: string, format: uuid }
                confirmPhrase: { type: string, description: 客户端 DangerConfirm 输入的确认短语 }
      responses:
        "200":
          description: 已触发（含审计 correlationId）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskView" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/risk/kill-switch/release:
    post:
      operationId: releaseKillSwitch
      tags: [risk]
      summary: 解除 kill switch（同 engage 约束）
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountId, reason, mfaChallengeRef, reauthTokenRef]
              properties:
                accountId: { type: string, format: uuid }
                reason: { type: string }
                mfaChallengeRef: { type: string, format: uuid }
                reauthTokenRef: { type: string, format: uuid }
      responses:
        "200":
          description: 已解除
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskView" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /v1/portfolio/stream:
    get:
      operationId: subscribePortfolio
      tags: [risk]
      summary: 组合/风险授权投影流（含 kill switch 广播）
      parameters:
        - { name: accountId, in: query, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/AfterSequence" }
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/StreamEvent" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ==================== C07 Proposal/Evaluation ====================
  /v1/proposals:
    get:
      operationId: listProposals
      tags: [proposal]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: status, in: query, schema: { type: string } }
        - { name: symbol, in: query, schema: { type: string } }
      responses:
        "200":
          description: 建议页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/TradeProposal" }
  /v1/proposals/{proposalId}:
    get:
      operationId: getProposal
      tags: [proposal]
      summary: 建议详情（executable 恒 false；无下单语义）
      parameters:
        - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 建议
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeProposal" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/proposals/{proposalId}/risk-evaluations:
    post:
      operationId: requestRiskEvaluation
      tags: [proposal]
      summary: 请求风险评估（携带 proposal/version/context hash；过期/陈旧/未发布/无权限服务端拒绝）
      parameters:
        - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contextHash]
              properties:
                contextHash: { type: string, description: quoteRef/accountRef/mode/版本组合 hash }
      responses:
        "202":
          description: 受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AsyncAccepted" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/proposals/{proposalId}/stream:
    get:
      operationId: subscribeProposal
      tags: [proposal]
      parameters:
        - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/AfterSequence" }
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/StreamEvent" }

  # ==================== C08 Approval/MFA ====================
  /v1/approvals:
    get:
      operationId: listApprovals
      tags: [approval]
      summary: 待办列表（仅审批人可见；禁自批由服务端强制）
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: 审批页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Approval" }
  /v1/approvals/{approvalId}:
    get:
      operationId: getApproval
      tags: [approval]
      summary: 审批详情（操作前客户端必须重取以刷新版本/有效期）
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 审批
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/approvals/{approvalId}/decisions:
    post:
      operationId: decideApproval
      tags: [approval]
      summary: 批准/拒绝/需要更多信息（MFA 签名；并发/过期/额度变化 409 强制刷新）
      parameters:
        - { name: approvalId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IfMatch" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, mfaChallengeRef]
              properties:
                decision: { type: string, enum: [approve, reject, request_info] }
                reason: { type: string, description: decision≠approve 时必填，写入审计 }
                mfaChallengeRef: { type: string, format: uuid }
                reauthTokenRef: { type: string, format: uuid }
      responses:
        "200":
          description: 已记录（批准时含 commandRef，服务端最终校验仍可在提交时拒绝）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Approval" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ==================== C09 Command/Order ====================
  /v1/commands:
    post:
      operationId: submitTradeCommand
      tags: [execution]
      summary: 提交已批准的 command ref（客户端不构造命令体；202 受理，成交以 Order 事件为准）
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commandRef]
              properties:
                commandRef: { type: string, format: uuid, description: 服务端签发的短时 TradeCommand 引用 }
      responses:
        "202":
          description: 受理（Execution Gateway 二次校验仍可能拒绝）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AsyncAccepted" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/orders:
    get:
      operationId: listOrders
      tags: [execution]
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: accountId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { name: symbol, in: query, schema: { type: string } }
      responses:
        "200":
          description: 订单页
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Order" }
  /v1/orders/{orderId}:
    get:
      operationId: getOrder
      tags: [execution]
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 订单（状态机/成交/关联 proposal/decision/release）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/orders/{orderId}/cancel-requests:
    post:
      operationId: requestOrderCancel
      tags: [execution]
      summary: 撤单请求（仅传服务端验证过的 command ref + 幂等键；202 受理）
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [commandRef]
              properties:
                commandRef: { type: string, format: uuid }
      responses:
        "202":
          description: 受理
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AsyncAccepted" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/orders/{orderId}/stream:
    get:
      operationId: subscribeOrder
      tags: [execution]
      summary: 订单事件流（sequence 去重；断流回补；ack 前不得显示成交）
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/AfterSequence" }
      responses:
        "200":
          description: SSE 事件流
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/StreamEvent" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ==================== C10 Audit / Controlled Export ====================
  /v1/audit/events:
    get:
      operationId: searchAuditEvents
      tags: [audit]
      summary: 服务端搜索已授权且字段级脱敏的审计事件
      x-quantos-capability: audit:read
      parameters:
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/PageSize" }
        - { name: correlationId, in: query, schema: { type: string, format: uuid } }
        - { name: causationId, in: query, schema: { type: string, format: uuid } }
        - { name: objectRef, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string } }
        - { name: startAt, in: query, schema: { $ref: "#/components/schemas/DateTime" } }
        - { name: endAt, in: query, schema: { $ref: "#/components/schemas/DateTime" } }
      responses:
        "200":
          description: 事件页；payload 已由服务端脱敏，不返回原始密钥、token 或完整账户标识
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEventPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/audit/evidence-chains/{correlationId}:
    get:
      operationId: getEvidenceChain
      tags: [audit]
      summary: 按 correlation ID 分页还原 causation 证据链
      x-quantos-capability: audit:read
      parameters:
        - { name: correlationId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: 证据链页；哈希用于完整性校验，不代替 Artifact 授权
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceChainPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/exports:
    post:
      operationId: createExport
      tags: [audit]
      summary: 创建受控导出；范围、理由、水印和 retention 全部写审计
      x-quantos-capability: audit:export
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
        - { name: X-Reauth-Token-Ref, in: header, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "202":
          description: 导出作业已受理，不代表已生成文件
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  /v1/exports/{exportId}:
    get:
      operationId: getExportStatus
      tags: [audit]
      summary: 查询导出状态；不在状态响应中携带签名 URL
      x-quantos-capability: audit:read
      parameters:
        - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 导出作业状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/exports/{exportId}/cancel:
    post:
      operationId: cancelExport
      tags: [audit]
      summary: 取消未过期导出；终态作业返回 409
      x-quantos-capability: audit:export
      parameters:
        - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
        - { name: X-Reauth-Token-Ref, in: header, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: 取消已受理并记录审计
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /v1/exports/{exportId}/download:
    get:
      operationId: getExportDownload
      tags: [audit]
      summary: 为 ready 导出签发一次性短时下载元数据
      x-quantos-capability: audit:export
      parameters:
        - { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 短时签名 URL；不得写入日志或持久化到客户端
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportDownloadMetadata" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410": { $ref: "#/components/responses/Gone" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: quantos_session
      description: BFF 服务端会话；Set-Cookie 必须使用 Secure、HttpOnly、SameSite=Strict，浏览器不得持久化 bearer token

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
      description: 不透明分页游标
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Sort:
      name: sort
      in: query
      schema: { type: string }
      description: 服务端排序表达式；允许值由具体 operation 明确列出，未知字段返回 422
    Filter:
      name: filter
      in: query
      schema: { type: string }
      description: 服务端过滤表达式；仅接受具体 operation allowlist 中的字段
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: 同一业务意图重试必须复用同一键；服务端按（actor, key）去重
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: expectedVersion（objectVersion）；不匹配返回 409 + currentVersion
    AfterSequence:
      name: afterSequence
      in: query
      schema: { type: integer, format: int64, minimum: 0, default: 0 }
      description: 只推送 sequence 严格大于该值的事件（断线回补）
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 16 }
      description: 与 SameSite CSRF cookie 绑定的双提交 token；BFF 同时校验 Origin allowlist

  headers:
    X-Correlation-Id:
      schema: { type: string, format: uuid }
      description: 全链路追踪 ID；错误页可复制提交支持
    ETag:
      schema: { type: string }
      description: 当前对象版本；后续可变写使用 If-Match 原样回传

  responses:
    Unauthorized:
      description: 会话失效/未认证；客户端清空内存态并跳登录（不泄露细节）
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { code: UNAUTHENTICATED, message: 会话已失效，请重新登录。, correlationId: 9a1c4e60-2d3b-4c5f-8a9e-1b2c3d4e5f60 }
    Forbidden:
      description: 无权限（规范文案；涉密钥/受限审计/高风险不返回内容）
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { code: FORBIDDEN, message: 你没有访问此资源的权限。若认为这是错误，请联系主工作区管理员。, correlationId: 4d5e6f70-8a9b-4c1d-2e3f-5a6b7c8d9e0f }
    NotFound:
      description: 不存在或未授权（不区分，防存在性泄露）
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example: { code: NOT_FOUND, message: 未找到该资源。, correlationId: 4d5e6f70-8a9b-4c1d-2e3f-5a6b7c8d9e0f }
    Conflict:
      description: 版本/状态/有效期冲突；返回 currentVersion，客户端保留本地草稿并刷新
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unprocessable:
      description: 校验失败（字段级 fieldErrors；含超预算/过期数据/未批准 capability 等原因）
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: 限流（retryAfter 秒；不泄露账户存在性）
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Gone:
      description: 受控资源已过期并不再可用；需重新创建导出
      headers:
        X-Correlation-Id: { $ref: "#/components/headers/X-Correlation-Id" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  schemas:
    # ---------- 基元 ----------
    UUID: { type: string, format: uuid }
    DateTime: { type: string, format: date-time, description: RFC 3339 UTC }
    DecimalValue:
      type: string
      pattern: "^-?\\d+(\\.\\d+)?$"
      description: 十进制定点字符串（proto DecimalValue.value；禁 IEEE-754 交易计算）
    MoneyValue:
      type: object
      required: [currencyCode, units, nanos]
      properties:
        currencyCode: { type: string, pattern: "^[A-Z]{3}$" }
        units: { type: string, format: int64 }
        nanos: { type: integer, minimum: -999999999, maximum: 999999999 }
    RuntimeMode:
      type: string
      enum: [research, paper, shadow, assisted_live]
      description: assisted_live 仅 M5+ 且服务端 flag/capability 放行才可见；客户端不得硬编码可用性
    Environment: { type: string, enum: [dev, staging, prod] }
    DataQuality:
      type: string
      enum: [verified, provisional, degraded, failed, expired, license_missing]
      description: 未知值客户端显示"未知/需升级"并阻断高风险动作
    TaskStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled, cancel_requested]
    OrderStatus:
      type: string
      enum: [draft, risk_checking, awaiting_approval, command_ready, submitted, accepted, partially_filled, filled, cancelled, rejected, expired]
    TimeWindow:
      type: object
      required: [start, end]
      properties:
        start: { $ref: "#/components/schemas/DateTime" }
        end: { $ref: "#/components/schemas/DateTime" }

    # ---------- 统一基线 ----------
    ErrorEnvelope:
      type: object
      required: [code, message, correlationId]
      properties:
        code: { type: string, description: 稳定机器码，如 FORBIDDEN/VERSION_CONFLICT/COMMAND_EXPIRED/DATA_STALE }
        message: { type: string, description: 安全可展示文案（i18n key 由客户端映射） }
        correlationId: { $ref: "#/components/schemas/UUID" }
        fieldErrors: { type: object, additionalProperties: { type: string } }
        retryAfter: { type: integer, minimum: 0, description: 秒 }
        currentVersion: { type: string, description: 409 时返回，供客户端 diff }
    Page:
      type: object
      required: [items]
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: string, description: 缺省表示末页 }
    AsyncAccepted:
      type: object
      required: [jobId, status, correlationId]
      properties:
        jobId: { $ref: "#/components/schemas/UUID" }
        status: { type: string, enum: [accepted, cancel_requested] }
        correlationId: { $ref: "#/components/schemas/UUID" }
    AuditedAsyncAccepted:
      allOf:
        - { $ref: "#/components/schemas/AsyncAccepted" }
        - type: object
          required: [auditRef]
          properties:
            auditRef: { $ref: "#/components/schemas/UUID" }
    ReauthRequest:
      type: object
      required: [challengeRef]
      properties:
        challengeRef: { $ref: "#/components/schemas/UUID" }
      additionalProperties: false
    StreamEvent:
      type: object
      required: [streamId, sequence, eventId, occurredAt, correlationId, payloadVersion, payload]
      properties:
        streamId: { $ref: "#/components/schemas/UUID" }
        sequence: { type: integer, format: int64, minimum: 1 }
        eventId: { $ref: "#/components/schemas/UUID" }
        occurredAt: { $ref: "#/components/schemas/DateTime" }
        correlationId: { $ref: "#/components/schemas/UUID" }
        payloadVersion: { type: string, description: 载荷 schema 版本（未知版本客户端 fail closed） }
        payload:
          type: object
          description: 领域事件载荷；payload.type=permission_revoked 为终态语义

    # ---------- C01 ----------
    SessionContext:
      type: object
      required: [actorId, tenantId, workspaceId, accountId, mode, environment, capabilities, mfaState, expiresAt]
      properties:
        actorId: { $ref: "#/components/schemas/UUID" }
        tenantId: { $ref: "#/components/schemas/UUID" }
        workspaceId: { $ref: "#/components/schemas/UUID" }
        accountId: { $ref: "#/components/schemas/UUID" }
        mode: { $ref: "#/components/schemas/RuntimeMode" }
        environment: { $ref: "#/components/schemas/Environment" }
        capabilities: { type: array, items: { type: string }, description: capability key 全集（权限裁剪唯一来源） }
        mfaState: { type: string, enum: [unenrolled, enrolled, challenged, verified] }
        expiresAt: { $ref: "#/components/schemas/DateTime" }

    # ---------- C17 Settings / Web Platform ----------
    ProfileSettingsInput:
      type: object
      required: [displayName, locale, timezone, theme, numberFormat, timeDisplay, defaultRoute, density, highContrast, reducedMotion]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        title: { type: string, maxLength: 120 }
        team: { type: string, maxLength: 120 }
        locale: { type: string, enum: [zh-CN, en] }
        timezone: { type: string, description: IANA timezone }
        theme: { type: string, enum: [system, dark, light] }
        numberFormat: { type: string, enum: [comma_dot, space_comma] }
        timeDisplay: { type: string, enum: [utc_local, local] }
        defaultRoute: { type: string, enum: [/command, /research, /portfolio, /markets] }
        density: { type: string, enum: [compact, comfortable] }
        highContrast: { type: boolean }
        reducedMotion: { type: boolean }
    ProfileSettings:
      allOf:
        - { $ref: "#/components/schemas/ProfileSettingsInput" }
        - type: object
          required: [memberId, email, emailVerified, roleLabels, objectVersion]
          properties:
            memberId: { type: string }
            email: { type: string, format: email, readOnly: true }
            emailVerified: { type: boolean, readOnly: true }
            roleLabels: { type: array, items: { type: string }, readOnly: true }
            objectVersion: { type: string }
    NotificationRule:
      type: object
      required: [key, severity, inApp, desktop, email, browser]
      properties:
        key: { type: string }
        severity: { type: string, enum: [critical, warning, info] }
        inApp: { type: boolean }
        desktop: { type: boolean }
        email: { type: boolean }
        browser: { type: boolean }
    NotificationPreferencesInput:
      type: object
      required: [rules, quietHoursEnabled, quietHoursStart, quietHoursEnd, criticalBypass, digestFrequency]
      properties:
        rules: { type: array, items: { $ref: "#/components/schemas/NotificationRule" } }
        quietHoursEnabled: { type: boolean }
        quietHoursStart: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        quietHoursEnd: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
        criticalBypass: { type: boolean, description: Critical 可绕过静默但仍受服务端授权策略约束 }
        digestFrequency: { type: string, enum: [off, daily, weekly] }
    NotificationPreferences:
      allOf:
        - { $ref: "#/components/schemas/NotificationPreferencesInput" }
        - type: object
          required: [objectVersion, browserPermission]
          properties:
            objectVersion: { type: string }
            browserPermission: { type: string, enum: [granted, denied, default, unsupported] }
    MfaFactor:
      type: object
      required: [factorId, method, label, createdAt, lastUsedAt, currentDevice]
      properties:
        factorId: { type: string }
        method: { type: string, enum: [passkey, authenticator, recovery_codes] }
        label: { type: string }
        createdAt: { $ref: "#/components/schemas/DateTime" }
        lastUsedAt: { $ref: "#/components/schemas/DateTime" }
        currentDevice: { type: boolean }
    SecuritySettings:
      type: object
      required: [posture, score, mfaEnabled, factors, recoveryCodesRemaining, lastVerifiedAt, correlationId]
      properties:
        posture: { type: string, enum: [strong, attention_required, unknown] }
        score: { type: integer, minimum: 0, maximum: 100 }
        mfaEnabled: { type: boolean }
        factors: { type: array, items: { $ref: "#/components/schemas/MfaFactor" } }
        recoveryCodesRemaining: { type: integer, minimum: 0 }
        lastVerifiedAt: { $ref: "#/components/schemas/DateTime" }
        correlationId: { $ref: "#/components/schemas/UUID" }
    ActiveSession:
      type: object
      required: [sessionId, client, platform, location, lastActiveAt, ipMasked, current]
      properties:
        sessionId: { type: string }
        client: { type: string }
        platform: { type: string }
        location: { type: string }
        lastActiveAt: { $ref: "#/components/schemas/DateTime" }
        ipMasked: { type: string, description: 仅脱敏 IP，禁止返回完整地址 }
        current: { type: boolean }
    TrustedDevice:
      type: object
      required: [deviceId, label, verificationMethod, trustedUntil, current]
      properties:
        deviceId: { type: string }
        label: { type: string }
        verificationMethod: { type: string, enum: [passkey, biometric, authenticator] }
        trustedUntil: { $ref: "#/components/schemas/DateTime" }
        current: { type: boolean }
    DownloadRecord:
      type: object
      required: [downloadId, objectLabel, format, requestedAt, status]
      properties:
        downloadId: { type: string }
        objectLabel: { type: string }
        format: { type: string }
        requestedAt: { $ref: "#/components/schemas/DateTime" }
        status: { type: string, enum: [preparing, ready, downloaded, expired, failed] }
        expiresAt: { $ref: "#/components/schemas/DateTime" }
        downloadUrl: { type: string, format: uri, description: BFF 短时签名 URL；不得写入日志或持久化 }
        watermarked: { type: boolean }
        correlationId: { $ref: "#/components/schemas/UUID" }
    BrowserCapabilityPolicy:
      type: object
      required: [kind, authFlow, notifications, localFileImport, deepLinkScheme, downloadsViaBff, offlineDomainActions, businessPagesNoIndex, cspEnforced, sessionProtected]
      properties:
        kind: { type: string, enum: [web] }
        authFlow: { type: string, enum: [browser_redirect] }
        notifications: { type: string, enum: [browser] }
        localFileImport: { type: boolean, enum: [false] }
        deepLinkScheme: { type: string, format: uri }
        downloadsViaBff: { type: boolean, enum: [true] }
        offlineDomainActions: { type: boolean, enum: [false] }
        businessPagesNoIndex: { type: boolean, enum: [true] }
        cspEnforced: { type: boolean }
        sessionProtected: { type: boolean }

    # ---------- C10 Audit / Controlled Export ----------
    AuditEvent:
      type: object
      required: [eventId, correlationId, sequence, kind, actor, objectRef, occurredAt, redactionApplied, redactedPayload, payloadHash, retentionUntil]
      properties:
        eventId: { $ref: "#/components/schemas/UUID" }
        correlationId: { $ref: "#/components/schemas/UUID" }
        causationId: { $ref: "#/components/schemas/UUID" }
        sequence: { type: integer, format: int64, minimum: 1 }
        kind: { type: string }
        actor: { type: string, description: 已脱敏的 actor 显示名或服务主体 }
        objectRef: { type: string }
        occurredAt: { $ref: "#/components/schemas/DateTime" }
        redactionApplied: { type: boolean, enum: [true] }
        redactedPayload:
          type: object
          additionalProperties: true
          description: 只允许服务端脱敏后输出；密钥、token、完整账户标识禁止出现
        payloadHash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        retentionUntil: { $ref: "#/components/schemas/DateTime" }
    AuditEventPage:
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [items]
          properties:
            items: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
    EvidenceNode:
      type: object
      required: [eventId, sequence, kind, objectRef, occurredAt, payloadHash, route, retentionUntil]
      properties:
        eventId: { $ref: "#/components/schemas/UUID" }
        causationId: { $ref: "#/components/schemas/UUID" }
        sequence: { type: integer, format: int64, minimum: 1 }
        kind: { type: string }
        objectRef: { type: string }
        occurredAt: { $ref: "#/components/schemas/DateTime" }
        payloadHash: { type: string, pattern: "^sha256:[a-f0-9]{64}$" }
        route: { type: string, pattern: "^/", description: 只含资源引用，不含 token }
        retentionUntil: { $ref: "#/components/schemas/DateTime" }
    EvidenceChainPage:
      type: object
      required: [correlationId, items, complete]
      properties:
        correlationId: { $ref: "#/components/schemas/UUID" }
        items: { type: array, items: { $ref: "#/components/schemas/EvidenceNode" } }
        nextCursor: { type: string }
        complete: { type: boolean, description: true 仅表示当前授权范围内证据链完整 }
    ExportScope:
      type: object
      required: [correlationIds]
      properties:
        correlationIds: { type: array, minItems: 1, maxItems: 100, uniqueItems: true, items: { $ref: "#/components/schemas/UUID" } }
        eventKinds: { type: array, maxItems: 50, uniqueItems: true, items: { type: string } }
        startAt: { $ref: "#/components/schemas/DateTime" }
        endAt: { $ref: "#/components/schemas/DateTime" }
      additionalProperties: false
    ExportRequest:
      type: object
      required: [scope, format, reason, watermark, retentionDays]
      properties:
        scope: { $ref: "#/components/schemas/ExportScope" }
        format: { type: string, enum: [jsonl, csv, pdf] }
        reason: { type: string, minLength: 8, maxLength: 500 }
        watermark: { type: string, minLength: 3, maxLength: 120 }
        retentionDays: { type: integer, minimum: 1, maximum: 30 }
      additionalProperties: false
    ExportJob:
      type: object
      required: [exportId, status, format, requestedBy, requestedAt, watermark, retentionUntil, correlationId, auditRef]
      properties:
        exportId: { $ref: "#/components/schemas/UUID" }
        status: { type: string, enum: [queued, generating, ready, cancel_requested, cancelled, expired, failed] }
        format: { type: string, enum: [jsonl, csv, pdf] }
        requestedBy: { type: string }
        requestedAt: { $ref: "#/components/schemas/DateTime" }
        completedAt: { $ref: "#/components/schemas/DateTime" }
        watermark: { type: string }
        retentionUntil: { $ref: "#/components/schemas/DateTime" }
        correlationId: { $ref: "#/components/schemas/UUID" }
        auditRef: { $ref: "#/components/schemas/UUID" }
    ExportDownloadMetadata:
      type: object
      required: [exportId, downloadUrl, expiresAt, sha256, sizeBytes, mediaType, watermarked, retentionUntil, auditRef]
      properties:
        exportId: { $ref: "#/components/schemas/UUID" }
        downloadUrl: { type: string, format: uri, description: 一次性不透明签名 URL，最长 5 分钟 }
        expiresAt: { $ref: "#/components/schemas/DateTime" }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        sizeBytes: { type: integer, format: int64, minimum: 1 }
        mediaType: { type: string }
        watermarked: { type: boolean, enum: [true] }
        retentionUntil: { $ref: "#/components/schemas/DateTime" }
        auditRef: { $ref: "#/components/schemas/UUID" }

    # ---------- C03/C04 ----------
    ResearchRun:
      type: object
      required: [runId, capability, dataSnapshotId, budget, deadlineAt, status, inputHash, engineVersion, evidenceRefs, correlationId, createdAt]
      properties:
        runId: { $ref: "#/components/schemas/UUID" }
        capability: { type: string }
        dataSnapshotId: { $ref: "#/components/schemas/UUID" }
        budget: { $ref: "#/components/schemas/DecimalValue" }
        costUnits: { $ref: "#/components/schemas/DecimalValue" }
        deadlineAt: { $ref: "#/components/schemas/DateTime" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        inputHash: { type: string }
        engineVersion: { type: string }
        artifactRefs: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        evidenceRefs: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        correlationId: { $ref: "#/components/schemas/UUID" }
        createdAt: { $ref: "#/components/schemas/DateTime" }
    DataSnapshot:
      type: object
      required: [snapshotId, schemaVersion, window, quality, contentHash, licenseLabel, capturedAt, maxAgeSeconds]
      properties:
        snapshotId: { $ref: "#/components/schemas/UUID" }
        schemaVersion: { type: string }
        window: { $ref: "#/components/schemas/TimeWindow" }
        sources: { type: array, items: { type: string } }
        quality: { $ref: "#/components/schemas/DataQuality" }
        qualityBlocked: { type: boolean, description: 质量受限阻断标识（服务端权威，前端不可覆盖） }
        contentHash: { type: string }
        licenseLabel: { type: string }
        capturedAt: { $ref: "#/components/schemas/DateTime" }
        maxAgeSeconds: { type: integer, format: int64 }
    Artifact:
      type: object
      required: [artifactId, hypothesis, summary, engineVersion, promptVersion, codeVersion, environmentHash, dataSnapshotId, contentHash, createdAt]
      properties:
        artifactId: { $ref: "#/components/schemas/UUID" }
        hypothesis: { type: string }
        summary: { type: string }
        engineVersion: { type: string }
        promptVersion: { type: string }
        codeVersion: { type: string }
        environmentHash: { type: string }
        dataSnapshotId: { $ref: "#/components/schemas/UUID" }
        contentHash: { type: string }
        lineageRefs: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        createdAt: { $ref: "#/components/schemas/DateTime" }

    # ---------- C05 ----------
    StrategySummary:
      type: object
      required: [strategyId, name, updatedAt]
      properties:
        strategyId: { $ref: "#/components/schemas/UUID" }
        name: { type: string }
        updatedAt: { $ref: "#/components/schemas/DateTime" }
    StrategyDraft:
      type: object
      required: [strategyId, objectVersion, files, parameters, updatedAt]
      properties:
        strategyId: { $ref: "#/components/schemas/UUID" }
        objectVersion: { type: string }
        files: { type: object, additionalProperties: { type: string } }
        parameters: { type: object }
        updatedAt: { $ref: "#/components/schemas/DateTime" }
    BacktestReport:
      type: object
      required: [runId, strategyId, dataSnapshotId, status, metrics, leakViolations, reportArtifactId]
      properties:
        runId: { $ref: "#/components/schemas/UUID" }
        strategyId: { $ref: "#/components/schemas/UUID" }
        dataSnapshotId: { $ref: "#/components/schemas/UUID" }
        status: { $ref: "#/components/schemas/TaskStatus" }
        metrics: { type: object, additionalProperties: { $ref: "#/components/schemas/DecimalValue" } }
        leakViolations: { type: array, items: { type: string }, description: 泄漏检查失败规则码（非空阻断 Release） }
        reportArtifactId: { $ref: "#/components/schemas/UUID" }
    StrategyRelease:
      type: object
      required: [releaseId, strategyId, backtestReportArtifactId, sourceDigest, imageDigest, parameterHash, parameters, snapshotId, allowedTargets, approvalState, createdAt]
      properties:
        releaseId: { $ref: "#/components/schemas/UUID" }
        strategyId: { $ref: "#/components/schemas/UUID" }
        backtestReportArtifactId: { $ref: "#/components/schemas/UUID" }
        sourceDigest: { type: string }
        imageDigest: { type: string }
        parameterHash: { type: string }
        parameters: { type: object }
        snapshotId: { $ref: "#/components/schemas/UUID" }
        allowedTargets:
          type: array
          items: { type: string, enum: [paper, shadow, assisted_live] }
          description: 服务端权威；M3/M4 仅 paper/shadow；assisted_live 出现需 flag 放行
        approvalState: { type: string, enum: [none, pending, approved, rejected, expired] }
        createdAt: { $ref: "#/components/schemas/DateTime" }

    # ---------- C06 ----------
    Position:
      type: object
      required: [symbol, side, quantity, avgPrice]
      properties:
        symbol: { type: string }
        side: { type: string, enum: [long, short] }
        quantity: { $ref: "#/components/schemas/DecimalValue" }
        avgPrice: { $ref: "#/components/schemas/DecimalValue" }
    PortfolioView:
      type: object
      required: [accountId, asOf, stale, positions, pnl, exposure]
      properties:
        accountId: { $ref: "#/components/schemas/UUID" }
        asOf: { $ref: "#/components/schemas/DateTime" }
        stale: { type: boolean, description: true 时命令类操作由服务端拒绝 }
        positions: { type: array, items: { $ref: "#/components/schemas/Position" } }
        pnl: { $ref: "#/components/schemas/MoneyValue" }
        exposure: { $ref: "#/components/schemas/DecimalValue" }
    RiskView:
      type: object
      required: [accountId, asOf, hitRules, limitIds, killSwitch]
      properties:
        accountId: { $ref: "#/components/schemas/UUID" }
        asOf: { $ref: "#/components/schemas/DateTime" }
        hitRules: { type: array, items: { type: string } }
        limitIds: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        killSwitch:
          type: object
          required: [state]
          properties:
            state: { type: string, enum: [disengaged, engaged] }
            actor: { type: string }
            at: { $ref: "#/components/schemas/DateTime" }

    # ---------- C07/C08 ----------
    Signal:
      type: object
      required: [signalId, strategyReleaseId, symbol, direction, strength, confidence, generatedAt, validUntil]
      properties:
        signalId: { $ref: "#/components/schemas/UUID" }
        strategyReleaseId: { $ref: "#/components/schemas/UUID" }
        symbol: { type: string }
        direction: { type: string, enum: [long, short, flat] }
        strength: { $ref: "#/components/schemas/DecimalValue" }
        confidence: { $ref: "#/components/schemas/DecimalValue" }
        generatedAt: { $ref: "#/components/schemas/DateTime" }
        validUntil: { $ref: "#/components/schemas/DateTime" }
    TradeProposal:
      type: object
      required: [proposalId, accountId, symbol, action, quantity, notional, signal, rationale, counterViews, evidenceRefs, confidence, expiresAt, executable, objectVersion]
      properties:
        proposalId: { $ref: "#/components/schemas/UUID" }
        accountId: { $ref: "#/components/schemas/UUID" }
        symbol: { type: string }
        action: { type: string, enum: [buy, sell, reduce, close] }
        quantity: { $ref: "#/components/schemas/DecimalValue" }
        notional: { $ref: "#/components/schemas/DecimalValue" }
        signal: { $ref: "#/components/schemas/Signal" }
        rationale: { type: string }
        counterViews:
          type: array
          items: { type: string }
          minItems: 1
          description: 反方观点（R04 强制；proto trading.v1.TradeProposal.counter_views）
        evidenceRefs: { type: array, items: { $ref: "#/components/schemas/UUID" } }
        confidence: { $ref: "#/components/schemas/DecimalValue" }
        expiresAt: { $ref: "#/components/schemas/DateTime" }
        executable: { type: boolean, enum: [false], description: 恒 false（A02；schema 层强制） }
        objectVersion: { type: string }
    Approval:
      type: object
      required: [approvalId, originator, objectVersion, status, expiresAt, correlationId]
      properties:
        approvalId: { $ref: "#/components/schemas/UUID" }
        originator: { type: string, description: 发起人 actorId（禁自批判定） }
        objectVersion: { type: string }
        status: { type: string, enum: [pending, approved, rejected, expired, conflict] }
        expiresAt: { $ref: "#/components/schemas/DateTime" }
        signature: { type: string, description: 批准后服务端签名 }
        commandRef: { $ref: "#/components/schemas/UUID", description: 批准后签发的短时 TradeCommand 引用 }
        correlationId: { $ref: "#/components/schemas/UUID" }

    # ---------- C09 ----------
    Fill:
      type: object
      required: [fillId, quantity, price, at]
      properties:
        fillId: { $ref: "#/components/schemas/UUID" }
        quantity: { $ref: "#/components/schemas/DecimalValue" }
        price: { $ref: "#/components/schemas/DecimalValue" }
        at: { $ref: "#/components/schemas/DateTime" }
    Order:
      type: object
      required: [orderId, commandId, accountId, venue, venueKind, symbol, intent, side, quantity, status, filledQuantity, averageFillPrice, fills, mode, correlationId, submittedAt]
      properties:
        orderId: { $ref: "#/components/schemas/UUID" }
        commandId: { $ref: "#/components/schemas/UUID" }
        decisionId: { $ref: "#/components/schemas/UUID" }
        proposalId: { $ref: "#/components/schemas/UUID" }
        releaseId: { $ref: "#/components/schemas/UUID" }
        accountId: { $ref: "#/components/schemas/UUID" }
        venue: { type: string }
        venueKind: { type: string, enum: [binance, okx, coinbase, ibkr, alpine, mock] }
        symbol: { type: string }
        intent: { type: string, enum: [open, increase, reduce, close] }
        side: { type: string, enum: [buy, sell] }
        quantity: { $ref: "#/components/schemas/DecimalValue" }
        prices: { type: array, items: { $ref: "#/components/schemas/DecimalValue" } }
        status: { $ref: "#/components/schemas/OrderStatus" }
        filledQuantity: { $ref: "#/components/schemas/DecimalValue" }
        averageFillPrice: { $ref: "#/components/schemas/DecimalValue" }
        fills: { type: array, items: { $ref: "#/components/schemas/Fill" } }
        mode: { $ref: "#/components/schemas/RuntimeMode" }
        correlationId: { $ref: "#/components/schemas/UUID" }
        submittedAt: { $ref: "#/components/schemas/DateTime" }
