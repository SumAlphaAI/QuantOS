# L02 reviewed template only. NOT INSTALLED or target-validated by local tests.
# With no reviewed IPAddressAllow override, ALL ingress and egress is denied.
# Operator must bind exact target CIDRs, TLS DNS/pins and dedicated DB login.
[Service]
NoNewPrivileges=yes
UMask=0077
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictNamespaces=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
IPAddressDeny=any
